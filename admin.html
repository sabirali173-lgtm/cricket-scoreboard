<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Scoreboard Admin</title>
<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="container">

<h1>🏏 Cricket Scoreboard Admin</h1>

<hr>

<h2>🎯 Live Match</h2>

<button onclick="loadMatches()">🔄 Load Live Matches</button>

<br><br>

<select id="matchSelect">
<option>Loading...</option>
</select>

<br><br>

<button onclick="saveMatch()">💾 Save Selected Match</button>

<hr>

<h2>Manual Score Update</h2>

<label>Team 1</label>
<input type="text" id="team1">

<label>Team 2</label>
<input type="text" id="team2">

<label>Runs</label>
<input type="number" id="runs">

<label>Wickets</label>
<input type="number" id="wickets">

<label>Overs</label>
<input type="text" id="overs">

<label>Batsman 1</label>
<input type="text" id="batsman1">

<label>Batsman 2</label>
<input type="text" id="batsman2">

<label>Bowler</label>
<input type="text" id="bowler">

<label>Target</label>
<input type="text" id="target">

<label>Status</label>
<input type="text" id="status">

<br><br>

<button onclick="saveScore()">
🏏 Update Scoreboard
</button>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
