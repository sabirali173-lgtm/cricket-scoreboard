<!-- Live Match Information ke neeche yeh add karein -->
<div class="action-section" style="margin-top: 20px; background: #1a1a2e; padding: 15px; border-radius: 10px;">
    <h3 style="color: #4caf50;">⚡ Update Live Action</h3>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
        <button onclick="updateAction('0')" style="background: #333; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer;">0</button>
        <button onclick="updateAction('1')" style="background: #333; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer;">1</button>
        <button onclick="updateAction('2')" style="background: #333; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer;">2</button>
        <button onclick="updateAction('3')" style="background: #333; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer;">3</button>
        <button onclick="updateAction('4')" style="background: #2196F3; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer;">4</button>
        <button onclick="updateAction('6')" style="background: #FF9800; color: black; border: none; padding: 10px 20px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer;">6</button>
        
        <!-- Aapki demand ke mutabiq '7' number ka button -->
        <button onclick="updateAction('7')" style="background: #9C27B0; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer;">7</button>
        
        <button onclick="updateAction('W')" style="background: #f44336; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer;">W</button>
    </div>
</div>
