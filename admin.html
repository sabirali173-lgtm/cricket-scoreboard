<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Scoreboard Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a1a; color: #fff; padding: 20px; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #00ffcc; margin-bottom: 20px; font-size: 32px; }
        hr { border: 1px solid #222; margin-bottom: 20px; }
        .section { background: #16162e; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2a2a4a; }
        h3 { color: #4a9eff; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; font-size: 20px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; background: #0f0f23; border: 1px solid #2a2a4a; border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
        .btn-green { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #00d169; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .btn-green:hover { background: #00ff88; }
        .row { display: flex; gap: 20px; }
        .col { flex: 1; }
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .action-buttons button { flex: 1; min-width: 60px; padding: 15px 0; border: none; border-radius: 10px; background: #2a2a4a; color: #fff; font-size: 22px; font-weight: bold; cursor: pointer; }
        .btn-four { background: #2196F3 !important; }
        .btn-six { background: #FF9800 !important; color: #000 !important; }
        .btn-seven { background: #9C27B0 !important; }
        .btn-w { background: #f44336 !important; }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .flex-row div { flex: 1; text-align: center; }
        .flex-row input { text-align: center; padding: 10px; margin-bottom: 5px; font-size: 14px; }
        .btn-save { width: 100%; padding: 15px; background: #4a9eff; color: #fff; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px;}
        @media (max-width: 768px) { .row { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏏 Cricket Scoreboard Admin</h1><hr>
        <div class="section">
            <h3>📺 Live Match Selector</h3>
            <button id="refreshBtn" onclick="loadMatchesFromFirebase()" class="btn-green">🔄 Refresh Live Matches</button>
            <select id="matchSelect"><option value="">-- Select a match --</option></select>
            <button onclick="selectMatch()" class="btn-green">✅ Select Match (Load Stats)</button>
        </div>
        <div class="section">
            <h3>📊 Live Match Information</h3>
            <div class="row">
                <div class="col">
                    <label>Team 1 Name</label><input type="text" id="t1Name" placeholder="e.g. West Indies">
                    <div class="flex-row"><div><label>Score</label><input type="text" id="t1Score" placeholder="344/10"></div><div><label>Overs</label><input type="text" id="t1Overs" placeholder="105.4"></div></div>
                </div>
                <div class="col">
                    <label>Team 2 Name</label><input type="text" id="t2Name" placeholder="e.g. Pakistan">
                    <div class="flex-row"><div><label>Score</label><input type="text" id="t2Score" placeholder="266/2"></div><div><label>Overs</label><input type="text" id="t2Overs" placeholder="65.6"></div></div>
                </div>
            </div>
        </div>
        <div class="section">
            <h3>⚡ Update Live Action</h3>
            <div class="action-buttons">
                <button onclick="updateAction('0')">0</button>
                <button onclick="updateAction('1')">1</button>
                <button onclick="updateAction('2')">2</button>
                <button onclick="updateAction('3')">3</button>
                <button onclick="updateAction('4')" class="btn-four">4</button>
                <button onclick="updateAction('6')" class="btn-six">6</button>
                <button onclick="updateAction('7')" class="btn-seven">7</button>
                <button onclick="updateAction('W')" class="btn-w">W</button>
            </div>
        </div>
        <div class="section">
            <h3>🏏 Players & Bowler Stats</h3>
            <div class="row">
                <div class="col"><label>Striker</label><input type="text" id="b1name" placeholder="Name"><div class="flex-row"><div><label>R</label><input type="text" id="b1r" placeholder="0"></div><div><label>B</label><input type="text" id="b1b" placeholder="0"></div></div></div>
                <div class="col"><label>Non-Striker</label><input type="text" id="b2name" placeholder="Name"><div class="flex-row"><div><label>R</label><input type="text" id="b2r" placeholder="0"></div><div><label>B</label><input type="text" id="b2b" placeholder="0"></div></div></div>
                <div class="col"><label>Bowler</label><input type="text" id="b3name" placeholder="Name"><div class="flex-row"><div><label>O</label><input type="text" id="b3o" placeholder="0.0"></div><div><label>W</label><input type="text" id="b3w" placeholder="0"></div></div></div>
            </div>
            <button onclick="updateFullMatchStats()" class="btn-save">💾 Update Full Scoreboard & Push to OBS</button>
        </div>
    </div>

    <script type="module">
        // 🔑 Aapki di gayi keys yahan set kar di gayi hain
        const firebaseConfig = {
            apiKey: "AIzaSyCoqYoEqgPiMVnsC2xeARhyDdfOYPWwiLM",
            authDomain: "obs-cricket-scoreboard.firebaseapp.com",
            projectId: "obs-cricket-scoreboard",
            storageBucket: "obs-cricket-scoreboard.firebasestorage.app",
            messagingSenderId: "593318975208",
            appId: "1:593318975208:web:507301f084c1f838c21b5d"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const matchSelect = document.getElementById('matchSelect');

        window.loadMatchesFromFirebase = async function() {
            try {
                const docRef = doc(db, 'scoreboard', 'availableMatches');
                const docSnap = await getDoc(docRef);
                matchSelect.innerHTML = '<option value="">-- Select a match from Firebase --</option>';
                if (docSnap.exists() && docSnap.data().list) {
                    const data = docSnap.data().list;
                    for (let match of data) {
                        let option = document.createElement('option');
                        option.value = match.id;
                        option.innerText = `${match.title} (${match.status})`;
                        matchSelect.appendChild(option);
                    }
                } else {
                    alert("❌ Firestore mein matches nahi mila! Pehle GitHub Actions run karein ya node debug.js chalaayein.");
                }
            } catch (error) {
                alert("❌ Error loading matches: " + error.message);
                console.error(error);
            }
        };

        window.selectMatch = async function() {
            const selectedId = matchSelect.value;
            if(!selectedId) return;
            const docRef = doc(db, 'scoreboard', 'availableMatches');
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data().list.find(m => m.id === selectedId);
                if(data) {
                    document.getElementById('t1Name').value = data.team1 || '';
                    document.getElementById('t2Name').value = data.team2 || '';
                }
            }
        };

        window.updateFullMatchStats = async function() {
            const liveDocRef = doc(db, 'scoreboard', 'live');
            const data = {
                team1: { name: document.getElementById('t1Name').value, score: document.getElementById('t1Score').value, overs: document.getElementById('t1Overs').value },
                team2: { name: document.getElementById('t2Name').value, score: document.getElementById('t2Score').value, overs: document.getElementById('t2Overs').value },
                striker: { name: document.getElementById('b1name').value, r: document.getElementById('b1r').value, b: document.getElementById('b1b').value },
                nonStriker: { name: document.getElementById('b2name').value, r: document.getElementById('b2r').value, b: document.getElementById('b2b').value },
                bowler: { name: document.getElementById('b3name').value, o: document.getElementById('b3o').value, w: document.getElementById('b3w').value }
            };
            await setDoc(liveDocRef, data, { merge: true });
            alert("✅ Scoreboard Update ho gaya! OBS par check karein.");
        };

        window.updateAction = async function(action) {
            const liveDocRef = doc(db, 'scoreboard', 'live');
            await setDoc(liveDocRef, { lastBall: action }, { merge: true });
            console.log("Action updated:", action);
        };
        
        // Page load hone par automatically matches load kar lein
        window.loadMatchesFromFirebase();
    </script>
</body>
</html>
