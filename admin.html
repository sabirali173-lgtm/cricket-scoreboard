<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Scoreboard Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="container">

    <h1>🏏 Cricket Scoreboard Admin</h1>

    <hr>

    <h2>🎯 Select Live Match</h2>

    <button onclick="loadMatches()">🔄 Load Live Matches</button>

    <br><br>

    <select id="matchSelect" style="width:100%;padding:10px;font-size:16px;">
        <option>Click "Load Live Matches"</option>
    </select>

    <br><br>

    <button onclick="saveMatch()">💾 Save Selected Match</button>

    <hr>

    <label>Team 1</label>
    <input type="text" id="team1" value="PAKISTAN">

    <label>Team 2</label>
    <input type="text" id="team2" value="WEST INDIES">

    <label>Runs</label>
    <input type="number" id="runs" value="0">

    <label>Wickets</label>
    <input type="number" id="wickets" value="0">

    <label>Overs</label>
    <input type="text" id="overs" value="0.0">

    <label>Target</label>
    <input type="number" id="target" value="0">

    <br><br>

    <button onclick="saveScore()">🏏 Update Scoreboard</button>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
