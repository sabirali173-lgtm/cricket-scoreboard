<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBS Cricket Scoreboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="extra-info">

    <div><b>RRR :</b> <span id="rrr">0.00</span></div>

    <div><b>Last Over :</b> <span id="lastOver">-</span></div>

    <div><b>Partnership :</b> <span id="partnership">-</span></div>

    <div><b>Match Phase :</b> <span id="matchPhase">-</span></div>

    <div><b>Toss :</b> <span id="toss">-</span></div>

</div>

<div class="scoreboard">

    <div class="top-bar">

        <div class="team left">

            <img id="team1Logo" class="team-logo" src="" alt="">

            <span id="team1">Team 1</span>

        </div>

        <div class="score-box">

            <div class="live">🔴 LIVE</div>

            <div class="score">
                <span id="runs">0</span>/<span id="wickets">0</span>
            </div>

            <div class="overs">
                (<span id="overs">0.0</span> Overs)
            </div>

            <div class="crr">
                CRR :
                <span id="crr">0.00</span>
            </div>

        </div>

        <div class="team right">

            <img id="team2Logo" class="team-logo" src="" alt="">

            <span id="team2">Team 2</span>

        </div>

    </div>

    <div class="middle">

        <div class="player">

            <div class="title">Batsman 1</div>

            <div id="batsman1">-</div>

            <div id="batsman1Runs">0 (0)</div>

        </div>

        <div class="player">

            <div class="title">Batsman 2</div>

            <div id="batsman2">-</div>

            <div id="batsman2Runs">0 (0)</div>

        </div>

    </div>

    <div class="bottom">

        <div>
            <b>Bowler :</b>
            <span id="bowler">-</span>
        </div>

        <div>
            <b>Figures :</b>
            <span id="bowlerFigures">-</span>
        </div>

        <div>
            <b>Target :</b>
            <span id="target">-</span>
        </div>

        <div>
            <b>Status :</b>
            <span id="status">-</span>
        </div>

    </div>

    <div class="match-info">

        <div>
            <b>Match :</b>
            <span id="match">-</span>
        </div>

        <div>
            <b>Venue :</b>
            <span id="venue">-</span>
        </div>

        <div>
            <b>Updated :</b>
            <span id="updated">--:--:--</span>
        </div>

    </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
