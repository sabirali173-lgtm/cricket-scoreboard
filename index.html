<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Scoreboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; overflow: hidden; }
        .scoreboard-container { width: 95vw; height: 95vh; aspect-ratio: 16 / 9; background: #0a0a1a; border-radius: 20px; padding: 15px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); }
        .top-section { display: flex; justify-content: space-between; height: 20%; gap: 10px; }
        .team-box { width: 30%; padding: 10px 15px; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; color: white; }
        .team-a { background: #0050b3; border-bottom: 4px solid #0099ff; }
        .team-b { background: #a3131b; border-bottom: 4px solid #ff4d4d; text-align: right; }
        .team-name { font-size: 24px; font-weight: 800; }
        .team-score { font-size: 45px; font-weight: 900; }
        .team-overs { font-size: 20px; font-weight: 600; }
        .center-box { width: 40%; background: #111; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; color: white; border-bottom: 4px solid #00ff00; }
        #action-box { font-size: 60px; font-weight: 900; color: white; height: 60px; width: 80px; display: flex; justify-content: center; align-items: center; margin: 10px 0; transition: all 0.1s; }
        .six-hit { background-color: yellow !important; color: black !important; border-radius: 10px; animation: flash-pulse 0.8s ease-in-out; }
        @keyframes flash-pulse { 0% { transform: scale(0.8); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .middle-section { height: 30%; display: flex; justify-content: center; align-items: center; }
        .pitch-bg { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #1d7e1d, #0e3f0e); display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px; }
        .bottom-section { height: 40%; display: flex; gap: 10px; align-items: stretch; }
        .player-card { flex: 1; background: linear-gradient(180deg, #b81830, #7a0b1b); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 10px; }
        .player-card:nth-child(2) { background: linear-gradient(180deg, #a3131b, #55050d); }
        .player-card:nth-child(3) { background: linear-gradient(180deg, #0f2a5c, #08142e); }
        .p-image { width: 45px; height: 45px; border-radius: 50%; background: white; margin-bottom: 5px; }
        .p-name { font-size: 22px; font-weight: 700; }
        .p-stats { font-size: 18px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="scoreboard-container">
        <div class="top-section">
            <div class="team-box team-a">
                <div class="team-name" id="t1Name">TEAM 1</div>
                <div class="team-score" id="t1Score">0/0</div>
                <div class="team-overs" id="t1Overs">0.0</div>
            </div>
            <div class="center-box">
                <div class="batting-label">BATTING</div>
                <div id="action-box">0</div>
            </div>
            <div class="team-box team-b">
                <div class="team-name" id="t2Name">TEAM 2</div>
                <div class="team-score" id="t2Score">0/0</div>
                <div class="team-overs" id="t2Overs">0.0</div>
            </div>
        </div>
        <div class="middle-section"><div class="pitch-bg"></div></div>
        <div class="bottom-section">
            <div class="player-card">
                <div class="p-name" id="b1name">Batsman 1</div>
                <div class="p-stats" id="b1runs">0 (0)</div>
            </div>
            <div class="player-card">
                <div class="p-name" id="b2name">Batsman 2</div>
                <div class="p-stats" id="b2runs">0 (0)</div>
            </div>
            <div class="player-card">
                <div class="p-name" id="b3name">Bowler</div>
                <div class="p-stats" id="b3stats">0-0</div>
            </div>
        </div>
    </div>

    <script type="module">
        // 🔑 Aapki di gayi keys yahan set kar di gayi hain
        const firebaseConfig = {
            apiKey: "AIzaSyCoqYoEqgPiMVnsC2xeARhyDdfOYPWwiLM",
            authDomain: "obs-cricket-scoreboard.firebaseapp.com",
            projectId: "obs-cricket-scoreboard",
            storageBucket: "obs-cricket-scoreboard.firebasestorage.app",
            messagingSenderId: "593318975208",
            appId: "1:593318975208:web:507301f084c1f838c21b5d"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const liveDocRef = doc(db, 'scoreboard', 'live');

        // ⚡ Live Listener - Admin update hoga toh scoreboard turant change hoga
        onSnapshot(liveDocRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                
                document.getElementById('t1Name').innerText = data.team1?.name || "Team 1";
                document.getElementById('t1Score').innerText = data.team1?.score || "0/0";
                document.getElementById('t1Overs').innerText = data.team1?.overs || "0.0";
                
                document.getElementById('t2Name').innerText = data.team2?.name || "Team 2";
                document.getElementById('t2Score').innerText = data.team2?.score || "0/0";
                document.getElementById('t2Overs').innerText = data.team2?.overs || "0.0";

                document.getElementById('b1name').innerText = data.striker?.name || "Batsman";
                document.getElementById('b1runs').innerText = `${data.striker?.r || 0} (${data.striker?.b || 0})`;
                
                document.getElementById('b2name').innerText = data.nonStriker?.name || "Non-Striker";
                document.getElementById('b2runs').innerText = `${data.nonStriker?.r || 0} (${data.nonStriker?.b || 0})`;
                
                document.getElementById('b3name').innerText = data.bowler?.name || "Bowler";
                document.getElementById('b3stats').innerText = `${data.bowler?.o || 0}-${data.bowler?.w || 0}`;

                const actionBox = document.getElementById('action-box');
                if(data.lastBall) {
                    actionBox.innerText = data.lastBall;
                    actionBox.classList.add('six-hit');
                    setTimeout(() => actionBox.classList.remove('six-hit'), 800);
                }
            }
        });
    </script>
</body>
</html>
