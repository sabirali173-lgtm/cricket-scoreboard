<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Scoreboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="scoreboard">
        <!-- Header -->
        <div id="matchHeader">
            <h1 id="matchTitle">Team A vs Team B</h1>
            <span id="matchStatus">🟢 LIVE</span>
            <span id="matchVenue">Venue</span>
        </div>

        <!-- Main Score -->
        <div id="mainScore">
            <div id="team1Section">
                <img id="team1Logo" src="" alt="Team 1 Logo">
                <span id="team1Name">Team 1</span>
                <span id="team1Score">0</span>
                <span id="team1Wickets">0</span>
                <span id="team1Overs">0.0</span>
                <span id="team1RunRate">0.00</span>
            </div>
            
            <div id="team2Section">
                <img id="team2Logo" src="" alt="Team 2 Logo">
                <span id="team2Name">Team 2</span>
                <span id="team2Score">0</span>
                <span id="team2Wickets">0</span>
                <span id="team2Overs">0.0</span>
                <span id="team2RunRate">0.00</span>
            </div>
        </div>

        <!-- Batsmen -->
        <div id="batsmenInfo">
            <div id="batsman1">
                <span id="batsman1Name">Batsman 1</span>
                <span id="batsman1Runs">0</span>
                <span id="batsman1Balls">0</span>
                <span id="batsman1Fours">0</span>
                <span id="batsman1Sixes">0</span>
                <span id="batsman1StrikeRate">0.00</span>
            </div>
            <div id="batsman2">
                <span id="batsman2Name">Batsman 2</span>
                <span id="batsman2Runs">0</span>
                <span id="batsman2Balls">0</span>
                <span id="batsman2Fours">0</span>
                <span id="batsman2Sixes">0</span>
                <span id="batsman2StrikeRate">0.00</span>
            </div>
        </div>

        <!-- Bowler -->
        <div id="bowlerInfo">
            <span id="bowlerName">Bowler</span>
            <span id="bowlerOvers">0.0</span>
            <span id="bowlerRuns">0</span>
            <span id="bowlerWickets">0</span>
            <span id="bowlerEconomy">0.00</span>
        </div>

        <!-- Partnership & Required -->
        <div id="extraInfo">
            <span id="partnershipRuns">0</span>
            <span id="partnershipBalls">0</span>
            <span id="requiredRuns">0</span>
            <span id="requiredBalls">0</span>
            <span id="requiredRunRate">0.00</span>
        </div>

        <!-- Match Phase -->
        <div id="matchPhase"></div>
        <div id="matchResult"></div>

        <!-- Last Updated -->
        <div id="lastUpdated">--:--:--</div>
        
        <!-- Error Message -->
        <div id="errorMessage" style="display:none;"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "firebase": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"
        }
    }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
