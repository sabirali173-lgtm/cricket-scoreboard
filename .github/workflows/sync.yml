name: Sync Cricket Matches to Firestore

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      # 🔑 Base64 decode karke exact JSON file banayega (100% fail-proof)
      - name: Create serviceAccountKey.json from Secret
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 -d > serviceAccountKey.json

      - name: Run debug.js (Fetch & Sync to Firestore)
        run: node debug.js
        env:
          API_KEY: ${{ secrets.API_KEY }}

      # Security cleanup
      - name: Clean up
        run: rm serviceAccountKey.json
